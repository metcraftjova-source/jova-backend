<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="380" height="130">
  <rect width="380" height="130" fill="white"/>
  <!-- Blue circle -->
  <circle cx="58" cy="65" r="52" fill="#0055A5"/>
  <!-- CUMI text inside circle -->
  <text x="58" y="72" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="1">CUMI</text>
  <!-- Divider line -->
  <line x1="120" y1="25" x2="120" y2="105" stroke="#cccccc" stroke-width="1.5"/>
  <!-- CARBORUNDUM text -->
  <text x="252" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0055A5" letter-spacing="1.5">CARBORUNDUM</text>
  <!-- UNIVERSAL text -->
  <text x="252" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0055A5" letter-spacing="1.5">UNIVERSAL</text>
  <!-- LIMITED text -->
  <text x="252" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0055A5" letter-spacing="1.5">LIMITED</text>
</svg>
